<!-- Add this at the start of your HTML, before the main wrapper -->
<!-- Login Screen -->
<div id="loginScreen" style="display: none;">
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-md-4">
                <div class="card shadow-lg">
                    <div class="card-body p-5 text-center">
                        <i class="bi bi-building" style="font-size: 4rem; color: #0d6efd;"></i>
                        <h3 class="mt-3">Maya HR</h3>
                        <p class="text-muted">Human Resources Management System</p>
                        <hr>
                        <div id="g_id_onload"
                             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                             data-login_uri=""
                             data-auto_prompt="false">
                        </div>
                        <div id="googleLoginButton"></div>
                        <div class="mt-3">
                            <small class="text-muted">Only authorized company email addresses can access this system.</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
