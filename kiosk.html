<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maya HR - Staff Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary: #0d6efd; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        
        /* Base Container */
        .kiosk-container { width: 100%; max-width: 500px; padding: 20px; }
        
        /* Login Screen */
        .login-card { background: white; border-radius: 20px; padding: 40px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .login-card h3 { font-weight: 600; color: #1a1a2e; margin-bottom: 25px; }
        .login-card .form-control { font-size: 1.1rem; text-align: center; padding: 12px; height: 55px; }
        .login-card .btn-kiosk-login { width: 100%; height: 55px; font-size: 1.2rem; font-weight: 600; margin-top: 15px; background: var(--primary); color: white; border: none; }
        .login-card .btn-kiosk-login:disabled { opacity: 0.6; }
        #kioskError { color: #dc3545; min-height: 24px; font-size: 0.95rem; margin-top: 10px; }
        
        /* Dashboard Screen (Active session) */
        #kioskDashboard { display: none; }
        .kiosk-header { background: white; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .kiosk-header h4 { margin: 0; font-weight: 600; }
        .kiosk-header small { color: #6c757d; }
        
        .stage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stage-btn { height: 130px; border: none; border-radius: 15px; font-size: 1.4rem; font-weight: 600; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stage-btn i { font-size: 2.5rem; margin-bottom: 10px; }
        .stage-btn:active:not(:disabled) { transform: scale(0.95); }
        .stage-btn:disabled { opacity: 0.4; filter: grayscale(100%); pointer-events: none; }
        
        .btn-check-in { background: #198754; }
        .btn-break-out { background: #ffc107; color: #333; }
        .btn-break-in { background: #0dcaf0; color: #333; }
        .btn-check-out { background: #dc3545; }
        
        .logout-container { text-align: right; margin-top: 15px; }
        .btn-logout { background: transparent; color: #6c757d; border: 1px solid #dee2e6; font-size: 0.9rem; padding: 8px 20px; border-radius: 20px; }
        .btn-logout:hover { background: #f8f9fa; border-color: #adb5bd; }
    </style>
</head>
<body>

<div class="kiosk-container">
    
    <!-- SCREEN 1: LOGIN -->
    <div id="loginScreen" class="login-card">
        <i class="bi bi-building" style="font-size: 3.5rem; color: var(--primary);"></i>
        <h3>Maya HR Kiosk</h3>
        <p class="text-muted">Enter your ID and PIN to clock in/out</p>
        
        <div class="mb-3">
            <input type="text" class="form-control" id="kioskEmpId" placeholder="Employee ID" autocomplete="off">
        </div>
        <div class="mb-2">
            <input type="password" class="form-control" id="kioskPin" placeholder="PIN" maxlength="4" inputmode="numeric">
        </div>
        <div id="kioskError"></div>
        
        <button class="btn-kiosk-login" id="kioskLoginBtn" onclick="kioskLogin()">
            <i class="bi bi-box-arrow-in-right"></i> Clock In / Out
        </button>
        <p class="mt-3 text-muted" style="font-size: 0.8rem;">For authorized staff use only</p>
    </div>

    <!-- SCREEN 2: DASHBOARD -->
    <div id="kioskDashboard">
        <div class="kiosk-header">
            <h4 id="kioskEmpName">Welcome</h4>
            <small id="kioskEmpIdDisplay">ID: ---</small>
        </div>

        <div class="stage-grid">
            <button class="stage-btn btn-check-in" id="btnCheckIn" onclick="kioskAction('Check In')">
                <i class="bi bi-play-circle"></i> Check In
            </button>
            <button class="stage-btn btn-break-out" id="btnBreakOut" onclick="kioskAction('Break Out')">
                <i class="bi bi-pause-circle"></i> Break Out
            </button>
            <button class="stage-btn btn-break-in" id="btnBreakIn" onclick="kioskAction('Break In')">
                <i class="bi bi-play-circle"></i> Break In
            </button>
            <button class="stage-btn btn-check-out" id="btnCheckOut" onclick="kioskAction('Check Out')">
                <i class="bi bi-stop-circle"></i> Check Out
            </button>
        </div>

        <div class="logout-container">
            <button class="btn-logout" onclick="kioskLogout()">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- App Scripts -->
<script src="config.js"></script>
<script src="api.js"></script>
<script src="kiosk.js"></script>

</body>
</html>
