<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Maya Tex — Agent Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  /* Phone first: agents work from a phone, often on a slow connection. */
  :root { --navy:#0f2027; --teal:#0d9488; --line:#e3e8ea; --muted:#61727d; --bg:#f6f7f8; }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { margin:0; background:var(--bg); color:#15202b; }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 2px; color:var(--navy); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:16px; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--teal); }
  button { width:100%; padding:13px; border:none; border-radius:10px; background:var(--teal); color:#fff;
           font-size:16px; font-weight:600; cursor:pointer; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); font-weight:500; }
  button:disabled { opacity:.6; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .msg { font-size:13px; margin-top:10px; min-height:18px; }
  .msg.bad { color:#b3261e; } .msg.good { color:#0f7b4f; }
  .hide { display:none; }
  .who { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .who b { font-size:15px; } .who span { font-size:12px; color:var(--muted); }
  .cand { border-top:1px solid var(--line); padding:12px 0; }
  .cand:first-child { border-top:none; }
  .cand .nm { font-weight:600; }
  .cand .meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .pill { display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; color:#fff; }
  .p-Submitted{background:#8a9aa5;} .p-Selected{background:#61727d;} .p-VisaIssued{background:#0ea5b7;}
  .p-Travelling{background:#2563eb;} .p-Arrived{background:#a06800;} .p-Employee{background:#0f7b4f;}
  .p-OnHold{background:#334155;} .p-Cancelled{background:#b3261e;}
  .empty { color:var(--muted); font-size:14px; padding:8px 0; }
  .foot { text-align:center; color:var(--muted); font-size:11px; padding:8px 0 24px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ── SIGN IN ──────────────────────────────────────────────── -->
  <div class="card" id="loginCard">
    <h1>Maya Tex — Agent Portal</h1>
    <div class="sub">Sign in with the Agency ID and PIN given to you by Maya Tex HR.</div>
    <label for="agId">Agency ID</label>
    <input id="agId" placeholder="AG-01" autocomplete="off" autocapitalize="characters">
    <label for="agPin">PIN</label>
    <input id="agPin" type="password" inputmode="numeric" placeholder="6 digits" autocomplete="off">
    <div style="height:14px"></div>
    <button id="loginBtn" onclick="doLogin()">Sign in</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- ── MY CANDIDATES ───────────────────────────────────────── -->
  <div class="card hide" id="listCard">
    <div class="who">
      <div><b id="agName">—</b><br><span id="agMeta"></span></div>
      <button class="ghost" style="width:auto;padding:8px 12px" onclick="signOut()">Sign out</button>
    </div>
    <div id="candList"><div class="empty">Loading…</div></div>
    <div style="height:12px"></div>
    <button class="ghost" onclick="loadMine()"><i class="bi bi-arrow-repeat"></i> Refresh</button>
  </div>

  <!-- ── SUBMIT A CANDIDATE ──────────────────────────────────── -->
  <div class="card hide" id="addCard">
    <h1 style="font-size:17px">Submit a candidate</h1>
    <div class="sub">HR reviews every submission. You will see the status change here.</div>
    <label for="cName">Full name (exactly as in the passport)</label>
    <input id="cName" autocomplete="off">
    <div class="row">
      <div>
        <label for="cPassport">Passport number</label>
        <input id="cPassport" autocomplete="off" autocapitalize="characters">
      </div>
      <div>
        <label for="cNat">Nationality</label>
        <input id="cNat" value="Nepalese" autocomplete="off">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="cPosition">Position</label>
        <input id="cPosition" placeholder="Helper" autocomplete="off">
      </div>
      <div>
        <label for="cMobile">Mobile / WhatsApp</label>
        <input id="cMobile" inputmode="tel" placeholder="+977…" autocomplete="off">
      </div>
    </div>
    <label for="cRemark">Note for HR (optional)</label>
    <textarea id="cRemark" rows="2" placeholder="e.g. 3 years experience in a restaurant kitchen"></textarea>
    <div style="height:14px"></div>
    <button id="addBtn" onclick="doAdd()">Submit to HR</button>
    <div class="msg" id="addMsg"></div>
  </div>

  <div class="foot">Maya Tex Restaurants Company · HR</div>
</div>

<script>
// ============================================================
// Agent portal — the outside face of the Recruitment tab.
// Every call carries the Agency ID and PIN and is checked again on the
// server, so this page proves nothing by itself: it only shows what the
// backend agrees to return. Credentials are kept in this tab's session
// storage, so closing the tab signs the agent out.
// ============================================================
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyG5XLC79FnyLtSGGWunhJwU83SV0b0kz3y1FKdal-JBcTUM-X0ax134konYyTaKxYiiQ/exec';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function say(id, text, bad) { const el = $(id); el.className = 'msg' + (text ? (bad ? ' bad' : ' good') : ''); el.textContent = text || ''; }

let CRED = null;
try { const raw = sessionStorage.getItem('mayaAgent'); if (raw) CRED = JSON.parse(raw); } catch (e) { CRED = null; }

async function post(method, body) {
  const r = await fetch(EXEC_URL + '?method=' + method, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('Connection problem (' + r.status + '). Try again.');
  const d = await r.json();
  if (!d.success) throw new Error(d.error || 'Something went wrong.');
  return d;
}

async function doLogin() {
  const agencyId = $('agId').value.trim().toUpperCase();
  const pin = $('agPin').value.trim();
  if (!agencyId || !pin) { say('loginMsg', 'Enter your Agency ID and PIN.', true); return; }
  const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const d = await post('agentCandidates', { agencyId: agencyId, pin: pin });
    CRED = { agencyId: agencyId, pin: pin };
    try { sessionStorage.setItem('mayaAgent', JSON.stringify(CRED)); } catch (e) {}
    say('loginMsg', '');
    show(d);
  } catch (err) { say('loginMsg', err.message, true); }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
}

function signOut() {
  CRED = null;
  try { sessionStorage.removeItem('mayaAgent'); } catch (e) {}
  $('listCard').classList.add('hide'); $('addCard').classList.add('hide');
  $('loginCard').classList.remove('hide');
  $('agPin').value = '';
}

async function loadMine() {
  if (!CRED) return;
  try { show(await post('agentCandidates', CRED)); }
  catch (err) { $('candList').innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; }
}

function show(d) {
  $('loginCard').classList.add('hide');
  $('listCard').classList.remove('hide');
  $('addCard').classList.remove('hide');
  $('agName').textContent = d.name || d.agencyId;
  $('agMeta').textContent = d.agencyId + ' · ' + d.count + ' candidate' + (d.count === 1 ? '' : 's');

  const rows = d.data || [];
  if (!rows.length) { $('candList').innerHTML = '<div class="empty">No candidates yet. Submit one below.</div>'; return; }
  // Progress in the agent's words: the dates that matter to them.
  $('candList').innerHTML = rows.map(c => {
    const dates = [['Selected', c.selectedOn], ['Visa', c.visaOn], ['Travel', c.travelDate],
                   ['Arrived', c.arrivedOn], ['Joined', c.joinedOn]]
      .filter(x => x[1]).map(x => x[0] + ' ' + esc(x[1])).join(' · ');
    return '<div class="cand">' +
      '<div class="nm">' + esc(c.name) + ' <span class="pill p-' + esc(String(c.status).replace(/\s/g, '')) + '">' + esc(c.status) + '</span></div>' +
      '<div class="meta">' + esc(c.passport || '') + (c.position ? ' · ' + esc(c.position) : '') + '</div>' +
      (dates ? '<div class="meta">' + dates + '</div>' : '') +
      (c.remark ? '<div class="meta">' + esc(c.remark) + '</div>' : '') +
    '</div>';
  }).join('');
}

async function doAdd() {
  if (!CRED) return;
  const body = Object.assign({}, CRED, {
    name: $('cName').value.trim(), passportNo: $('cPassport').value.trim().toUpperCase(),
    nationality: $('cNat').value.trim(), position: $('cPosition').value.trim(),
    mobile: $('cMobile').value.trim(), remark: $('cRemark').value.trim()
  });
  if (!body.name || !body.passportNo) { say('addMsg', 'Name and passport number are required.', true); return; }
  const btn = $('addBtn'); btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const d = await post('agentAddCandidate', body);
    say('addMsg', d.message);
    ['cName', 'cPassport', 'cMobile', 'cRemark'].forEach(id => $(id).value = '');
    loadMine();
  } catch (err) { say('addMsg', err.message, true); }
  finally { btn.disabled = false; btn.textContent = 'Submit to HR'; }
}

$('agPin').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
if (CRED) loadMine();          // still signed in from earlier in this tab
</script>
</body>
</html>
