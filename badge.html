<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1a1f">
<title>Maya Staff</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   The phone. It does one thing: prove who you are, by scanning
   the code on the terminal. The punch itself happens on the
   terminal — this screen just sends you to it.
   ============================================================ */
:root{ --dark:#0b1a1f; --dark-2:#12262d; --teal:#17a2a2; --line:#1e3a42;
       --muted:#8aa5ad; --ok:#2f9e6b; --bad:#bd4630; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--dark); color:#eaf3f5; font-family:'Space Grotesk',system-ui,sans-serif;
     display:flex; flex-direction:column; -webkit-user-select:none; user-select:none;}
.screen{display:none; flex:1; flex-direction:column; padding:24px; }
.screen.on{display:flex;}
.head{padding-top:6vh; text-align:center;}
.head h1{font-size:24px; margin-bottom:4px;}
.head p{color:var(--muted); font-size:15px;}
.mid{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px;}
label{font-size:13px; color:var(--muted); margin-bottom:6px; display:block;}
input{width:100%; padding:16px; font-size:19px; font-family:inherit; background:var(--dark-2);
      color:#fff; border:2px solid var(--line); border-radius:14px;}
input:focus{outline:none; border-color:var(--teal);}
button{font-family:inherit; font-weight:700; cursor:pointer; border:none; border-radius:16px;
       background:var(--teal); color:#04181a; font-size:19px; padding:18px; width:100%;}
button.ghost{background:transparent; color:var(--muted); border:2px solid var(--line); font-weight:600; font-size:16px; padding:14px;}
button:disabled{opacity:.5;}
.msg{min-height:22px; text-align:center; font-size:15px; font-weight:600; margin-top:12px;}
.msg.bad{color:#ff8e7a;} .msg.good{color:#7fe0b0;}
.me{text-align:center; margin-bottom:8px;}
.me b{display:block; font-size:22px;}
.me span{font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--teal); letter-spacing:.06em;}
.scanwrap{position:relative; border-radius:20px; overflow:hidden; background:#000; aspect-ratio:1/1;}
#scanVid{width:100%; height:100%; object-fit:cover;}
.frame{position:absolute; inset:14%; border:3px solid rgba(255,255,255,.85); border-radius:16px;}
.tip{text-align:center; color:var(--muted); font-size:14px; margin-top:12px;}
.big{text-align:center; padding:6vh 0;}
.big .tick{width:110px; height:110px; border-radius:50%; background:var(--ok); color:#04180f;
           display:grid; place-items:center; font-size:60px; font-weight:700; margin:0 auto 20px;}
.big .tick.bad{background:var(--bad); color:#fff; font-size:52px;}
.big h2{font-size:26px; margin-bottom:8px;}
.big p{color:var(--muted); font-size:16px;}
.foot{text-align:center; color:#55707a; font-size:11px; padding:10px 0;}
</style>
</head>
<body>

<!-- ── SIGN IN — once ─────────────────────────────────────────── -->
<div class="screen on" id="scrLogin">
  <div class="head"><h1>Maya Staff</h1><p>Sign in once. Then your phone is your badge.</p></div>
  <!-- Add to Home Screen makes this an icon on his phone, and the personal
       link in the address means it can register itself again if the browser
       ever forgets him. -->
  <div class="mid">
    <div><label for="lId">Employee ID</label><input id="lId" placeholder="MT-00060" autocapitalize="characters" autocomplete="off"></div>
    <div><label for="lPin">PIN</label><input id="lPin" type="password" inputmode="numeric" placeholder="Your kiosk PIN" autocomplete="off"></div>
    <button id="lBtn" onclick="doLogin()">Sign in</button>
    <div class="msg" id="lMsg"></div>
  </div>
</div>

<!-- ── HOME — one button ──────────────────────────────────────── -->
<div class="screen" id="scrHome">
  <div class="head"><div class="me"><b id="hName">—</b><span id="hId">—</span></div></div>
  <div class="mid">
    <div id="badgeBox" style="background:#fff;padding:14px;border-radius:20px;line-height:0;margin:0 auto;width:100%;max-width:min(92vw,420px)"></div>
    <div class="ticker" id="bTicker" style="display:flex;gap:5px;justify-content:center;margin-top:16px"></div>
    <div class="tip">Hold this up to the terminal, about a hand's length from its camera.
      Turn your screen brightness up if it does not read.</div>
    <div class="msg" id="hMsg"></div>
  </div>
  <button class="ghost" onclick="signOut()">Sign out</button>
</div>

<div class="foot">Maya Tex Restaurants Company</div>

<script src="qrcode.min.js"></script>
<script src="config.js"></script>
<script>
// ============================================================
// Sign in with the same ID and PIN as the kiosk; the phone keeps
// them so this is a one-tap job every day. Scanning sends the code
// to the backend, which checks it is genuine and current, then
// hands the man over to the terminal. Nothing is punched here.
// ============================================================
// The one place the endpoint is defined for the whole project: config.js.
// Never written into this page — when the deployment URL changes, config.js
// changes and every page follows, this one included.
const EXEC = (function () {
  if (typeof CONFIG !== 'undefined' && CONFIG && CONFIG.API_URL) return String(CONFIG.API_URL).replace('/dev', '/exec');
  if (typeof API_URL !== 'undefined' && API_URL) return String(API_URL).replace('/dev', '/exec');
  alert('config.js did not load — this page cannot reach the backend.');
  return '';
})();

const $ = id => document.getElementById(id);
let ME = null, stream = null, scanning = false, rafId = null;

try { ME = JSON.parse(localStorage.getItem('mayaStaff') || 'null'); } catch (e) { ME = null; }

function show(which) {
  ['scrLogin','scrHome'].forEach(id => $(id).classList.toggle('on', id === which));
}
function say(id, text, bad) {
  const el = $(id); el.className = 'msg' + (text ? (bad ? ' bad' : ' good') : ''); el.textContent = text || '';
}
async function call(method, body) {
  const r = await fetch(EXEC + '?method=' + method, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body || {})
  });
  if (!r.ok) {
    if (r.status === 404) throw new Error('The backend URL is not answering (404). Ask HR.');
    throw new Error('No connection (' + r.status + '). Try again in a moment.');
  }
  const d = await r.json();
  if (!d.success) throw new Error(d.error || 'Something went wrong');
  return d;
}

// ── sign in ──────────────────────────────────────────────────
async function doLogin() {
  const empId = $('lId').value.trim().toUpperCase(), pin = $('lPin').value.trim();
  if (!empId || !pin) { say('lMsg', 'Enter your ID and PIN.', true); return; }
  const btn = $('lBtn'); btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const d = await call('issueBadge', { empId: empId, pin: pin });
    ME = { empId: d.empId, name: d.name, secret: d.secret,
           windowSec: d.windowSec, offsetMs: d.serverNow - Date.now() };
    saveMe();
    say('lMsg', '');
    home();
  } catch (err) { say('lMsg', err.message, true); }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
}
// Private browsing throws here, and a man would otherwise be asked to sign
// in every single day without ever being told why.
function saveMe() {
  try {
    localStorage.setItem('mayaStaff', JSON.stringify(ME));
    return true;
  } catch (e) {
    say('hMsg', 'This browser is not keeping you signed in — private mode? Open the page in a normal tab.', true);
    return false;
  }
}

function home() {
  $('hName').textContent = ME.name || ME.empId;
  $('hId').textContent = ME.empId;
  show('scrHome');
  startBadge();
  // If storage did not take, the badge still works now but will not survive
  // a restart — say so rather than let it fail silently tomorrow morning.
  try {
    localStorage.setItem('mayaStaffCheck', '1');
    localStorage.removeItem('mayaStaffCheck');
    say('hMsg', '');
  } catch (e) {
    say('hMsg', 'This browser will forget you when it closes — use a normal tab, not private browsing.', true);
  }
}
function signOut() {
  clearInterval(TICK);
  localStorage.removeItem('mayaStaff'); ME = null;
  $('lPin').value = ''; show('scrLogin');
}

// ── the badge ────────────────────────────────────────────────
// The phone draws its own code, every 30 seconds, from a secret it was
// given when it signed in. No network is needed to show it — a man with
// no signal in the kitchen still has a working badge. The tablet is the
// thing that has to be online.
let TICK = null;

async function hmacHex(secret, message) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// The server's clock, not this phone's — the offset was measured at sign-in.
function serverNow() { return Date.now() + (ME && ME.offsetMs ? ME.offsetMs : 0); }
function currentWindow() { return Math.floor(serverNow() / 1000 / (ME && ME.windowSec ? ME.windowSec : 30)); }

let badgeWin = null;
async function paintBadge() {
  if (!ME || !ME.secret) return;
  const win = currentWindow();
  if (win !== badgeWin) {
    badgeWin = win;
    const full = await hmacHex(ME.secret, ME.empId + ':' + win);
    const payload = 'MAYA2|' + ME.empId + '|' + win + '|' + full.slice(0, 8).toUpperCase();
    const qr = qrcode(0, 'M');
    qr.addData(payload);
    qr.make();
    $('badgeBox').innerHTML = qr.createSvgTag({ cellSize: 12, margin: 0, scalable: true });
  }
  const per = (ME.windowSec || 30);
  const secs = per - Math.floor((serverNow() / 1000) % per);
  const lit = Math.ceil(secs / (per / 5));
  $('bTicker').innerHTML = [0,1,2,3,4].map(i =>
    '<i style="width:26px;height:5px;border-radius:3px;display:block;background:' +
    (i < lit ? 'var(--teal)' : 'var(--line)') + '"></i>').join('');
}

function startBadge() {
  clearInterval(TICK);
  badgeWin = null;
  paintBadge();
  TICK = setInterval(paintBadge, 1000);
  // The screen must stay awake while he walks to the terminal.
  try { if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
}

// ── start ────────────────────────────────────────────────────
// Three ways in, in order of how little the man has to do:
//   1. his phone already knows him — nothing at all
//   2. he opened his personal link — registers itself, nothing typed
//   3. neither — sign in once with ID and PIN
async function begin() {
  if (ME && ME.empId && ME.secret) { home(); return; }

  let k = null;
  try { k = new URLSearchParams(location.search).get('k'); } catch (e) { k = null; }
  if (k) {
    show('scrLogin');
    say('lMsg', 'Setting up your badge…');
    try {
      const d = await call('badgeByLink', { k: k });
      ME = { empId: d.empId, name: d.name, secret: d.secret,
             windowSec: d.windowSec, offsetMs: d.serverNow - Date.now() };
      saveMe();
      say('lMsg', '');
      home();
      return;
    } catch (err) { say('lMsg', err.message, true); }
  }
  show('scrLogin');
  if (!k) say('lMsg', 'Sign in once. Your phone then shows your badge, with no signal needed.');
}
begin();
document.addEventListener('visibilitychange', () => { if (!document.hidden && ME && ME.secret) { badgeWin = null; paintBadge(); } });
$('lPin').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

</script>
</body>
</html>
