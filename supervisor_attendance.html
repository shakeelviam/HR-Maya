<style>

  .ask .why { color:#7a5200; }

  .lbl { font-size:.78rem; color:#5b6472; margin-bottom:2px; }

// ============================================================================

let SUP_MAP = {}, MY = null, state = [];

function fmtDate(iso){ const [y,m,d]=iso.split('-'); return d+'-'+m+'-'+y; }
function toIso(dd){ const [d,m,y]=dd.split('-'); return y+'-'+m+'-'+d; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function load(){
  document.getElementById('windowLabel').textContent =
    fmtDate(PERIOD.from) + ' to ' + fmtDate(PERIOD.to);
  let opts = [];
  try{
    const r = await fetch(EXEC_URL + '?method=getLocationSupervisors&_=' + Date.now(), { cache:'no-store' });
    const d = await r.json();
    if(d && d.success){
      (d.data||[]).forEach(loc=>{
        (loc.supervisors||[]).forEach(s=>{
          SUP_MAP[s.id] = { name:s.name, location:loc.location };
          opts.push('<option value="'+s.id+'">'+esc(s.name)+' — '+esc(loc.location)+'</option>');
        });
      });
    }
  }catch(e){ /* fall through to the built-in list */ }
  if(!opts.length){
    SUP_FALLBACK.forEach(b=>b.ids.forEach(id=>{
      const nm = SUP_NAMES[id] || (ROWS.find(x=>x.id===id)||{}).name || id;
      SUP_MAP[id] = { name:nm, location:b.loc };
      opts.push('<option value="'+id+'">'+esc(nm)+' — '+esc(b.loc)+'</option>');
    }));
  }
  document.getElementById('supPick').innerHTML =
    '<option value="">— select your name —</option>' + opts.join('');
}

function onSupPick(){
  const id = document.getElementById('supPick').value;
  MY = SUP_MAP[id] || null;
  document.getElementById('intro').style.display = MY ? 'none' : '';
  render();
}

function render(){
  const list = document.getElementById('list');
  const mine = MY ? ROWS.filter(r => r.loc === MY.location) : [];
  state = mine.map(r => ({ ...r, status: r.status || '', sent:false, failed:false }));
  document.getElementById('empty').style.display = (MY && !mine.length) ? '' : 'none';
  document.getElementById('bar').style.display   = mine.length ? '' : 'none';
  list.innerHTML = state.map((r,i)=>{
    const nextDay = r.co && r.ci && r.co < r.ci;
    return '<div class="day'+(r.flag==='ASK'?' ask':'')+'" id="d'+i+'">'
      + '<div class="day-head">'
      +   '<span class="who">'+esc(r.name)+'</span>'
      +   '<span class="when">'+esc(r.date)+(r.shift?' &middot; '+esc(r.shift):'')+'</span>'
      +   (r.flag==='ASK'?'<span class="badge text-bg-warning ms-auto">needs your decision</span>':'')
      +   (r.flag==='CHECK'?'<span class="badge text-bg-secondary ms-auto">please check</span>':'')
      + '</div>'
      + '<div class="why">'+esc(r.why)+'</div>'
      + '<div class="body">'
      +   '<div class="d-flex gap-2">'
      +     '<button type="button" class="btn btn-outline-success sbtn" data-s="Present" onclick="pick('+i+',this)">Present</button>'
      +     '<button type="button" class="btn btn-outline-danger  sbtn" data-s="Absent"  onclick="pick('+i+',this)">Absent</button>'
      +     '<button type="button" class="btn btn-outline-info    sbtn" data-s="Day Off" onclick="pick('+i+',this)">Day Off</button>'
      +   '</div>'
      +   '<div class="times" id="t'+i+'">'
      +     '<div><div class="lbl">Started</div>'
      +       '<input type="time" class="form-control" id="ci'+i+'" value="'+esc(r.ci)+'" onchange="sync('+i+')"></div>'
      +     '<div><div class="lbl">Finished '
      +       '<span class="nextday" id="nd'+i+'">'+(nextDay?'(next morning)':'')+'</span></div>'
      +       '<input type="time" class="form-control" id="co'+i+'" value="'+esc(r.co)+'" onchange="sync('+i+')"></div>'
      +   '</div>'
      +   '<div class="rowmsg" id="m'+i+'"></div>'
      + '</div></div>';
  }).join('');
  state.forEach((r,i)=>{ if(r.status) applyPick(i, r.status); });
  tally();
}

function pick(i, btn){ applyPick(i, btn.getAttribute('data-s')); tally(); }

function applyPick(i, s){
  state[i].status = s;
  const card = document.getElementById('d'+i);
  card.querySelectorAll('.sbtn').forEach(b=>{
    b.className = 'btn btn-outline-' +
      (b.getAttribute('data-s')==='Present' ? 'success' :
       b.getAttribute('data-s')==='Absent'  ? 'danger'  : 'info') + ' sbtn';
    if(b.getAttribute('data-s')===s)
      b.classList.add(s==='Present'?'on-p':s==='Absent'?'on-a':'on-d');
  });
  document.getElementById('t'+i).classList.toggle('show', s==='Present');
}

function sync(i){
  state[i].ci = document.getElementById('ci'+i).value;
  state[i].co = document.getElementById('co'+i).value;
  const nd = state[i].co && state[i].ci && state[i].co < state[i].ci;
  document.getElementById('nd'+i).textContent = nd ? '(next morning)' : '';
  tally();
}

function tally(){
  const ready = state.filter(r=>r.status && !r.sent).length;
  const done  = state.filter(r=>r.sent).length;
  const blank = state.filter(r=>!r.status).length;
  document.getElementById('tally').textContent =
    done   ? done+' saved' + (ready?', '+ready+' to go':'')
  : blank  ? state.length+' days — '+blank+' still need an answer'
           : state.length+' days filled in — check them, then save';
}

async function callGet(method, timeoutMs){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), timeoutMs||60000);
  try{
    const res = await fetch(EXEC_URL + '?method=' + method + '&_=' + Date.now(),
                            { cache:'no-store', signal:ctl.signal });
    const d = await res.json();
    if(!d.success) throw new Error(d.error || (method+' failed'));
    return d;
  } finally { clearTimeout(t); }
}

async function post(method, payload){
  const res = await fetch(EXEC_URL + '?method=' + method, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  const d = await res.json();
  if(!d.success) throw new Error(d.error || (method+' failed'));
  return d;
}

async function submitAll(){
  const id = document.getElementById('supPick').value;
  if(!id){ alert('Select your name first.'); return; }
  const by = SUP_MAP[id].name + ' (' + id + ')';
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.innerHTML = 'Saving…';

  for(let i=0;i<state.length;i++){
    const r = state[i];
    if(!r.status || r.sent) continue;
    const msg = document.getElementById('m'+i);
    const card = document.getElementById('d'+i);
    msg.innerHTML = '<span class="text-muted">saving…</span>';
    try{
      if(r.status==='Present' && (!r.ci || !r.co))
        throw new Error('Enter both the start and the finish time.');

      await post(M_STATUS, { empId:r.id, location:r.loc, shift:r.shift||'',
                             date:r.date, status:r.status, by:by });

      if(r.status==='Present'){
        // the finish may land on the next calendar day
        let coDate = r.date;
        if(r.co < r.ci){
          const d = new Date(toIso(r.date)); d.setDate(d.getDate()+1);
          coDate = fmtDate(d.toISOString().slice(0,10));
        }
        await post(M_PUNCH, { empId:r.id, stage:'Check In',  date:r.date,  time:r.ci, location:r.loc, by:by });
        await post(M_PUNCH, { empId:r.id, stage:'Check Out', date:coDate, time:r.co, location:r.loc, by:by });
      }
      r.sent = true; r.failed = false;
      card.classList.remove('failed'); card.classList.add('done');
      msg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> saved</span>';
    }catch(err){
      r.failed = true;
      card.classList.remove('done'); card.classList.add('failed');
      msg.innerHTML = '<span class="text-danger">'+esc(err.message)+' — not saved, try again</span>';
    }
    tally();
  }
  const saved = state.filter(r=>r.sent).length;
  const left  = state.filter(r=>r.status && !r.sent).length;
  const note  = document.getElementById('tally');

  // Rebuild the daily sheet so the entries show up straight away.
  // Only if something actually saved, and only once for the whole batch.
  if(saved){
    btn.innerHTML = 'Updating the sheet…';
    note.innerHTML = '<span class="text-muted">'+saved+' saved. Updating the attendance sheet…</span>';
    try{
      await callGet(M_REBUILD, REBUILD_TIMEOUT_MS);
      note.innerHTML = '<span class="text-success">'+saved+' saved and the attendance sheet is updated.</span>';
    }catch(err){
      // The punches ARE written. Only the rebuild failed - say so plainly,
      // so nobody re-enters days that are already in.
      note.innerHTML = '<span class="text-danger"><b>Your '+saved+' entries are saved.</b> '
        + 'The attendance sheet could not be refreshed just now ('+esc(err.name==='AbortError'?'it took too long':err.message)+'). '
        + 'Do not enter them again — tell HR to refresh it.</span>';
    }
  }

  btn.disabled = false;
  btn.innerHTML = left ? '<i class="bi bi-check2-all"></i> Save all'
                       : '<i class="bi bi-check2-all"></i> All saved';
}

load();
</script>
